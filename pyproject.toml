[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minimal-oj"
version = "0.1.0"
description = "Minimal local online judge"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "sqlalchemy>=2.0.0",
  "pydantic>=2.8.0",
  "rq>=1.16.0",
  "redis>=5.0.0",
  "psycopg2-binary>=2.9.0",
]

[tool.setuptools]
packages = ["app", "worker"]
