[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minimal-oj"
version = "0.1.0"
description = "Minimal local online judge"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "sqlalchemy>=2.0.0",
  "pydantic>=2.8.0",
  "rq>=1.16.0",
  "redis>=5.0.0",
  "psycopg2-binary>=2.9.0",
  "passlib>=1.7.4",
  "argon2-cffi",
  "ruff>=0.15.12",
  "pre-commit>=4.3.0",
]


[dependency-groups]
dev = [
    "ruff>=0.15.12",
]


[tool.setuptools]
packages = ["app", "worker"]


[tool.ruff]
exclude = [
    ".venv",
    "data",
    "__pycache__",
    "source"
]

line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = []

fixable = ["ALL"]
unfixable = []


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"


[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "F403"]
"**/**/__init__.py" = ["F401", "F403"]
