services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: oj_user
      POSTGRES_PASSWORD: oj_password
      POSTGRES_DB: oj_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oj_user -d oj_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      OJ_DB_URL: postgresql://oj_user:oj_password@postgres:5432/oj_db
      OJ_DATA_DIR: /data
      OJ_REDIS_URL: redis://redis:6379/0
    volumes:
      - ./data:/data
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: ["python", "-m", "worker.run_worker"]
    privileged: true
    cgroup: host
    environment:
      OJ_DB_URL: postgresql://oj_user:oj_password@postgres:5432/oj_db
      OJ_DATA_DIR: /data
      OJ_REDIS_URL: redis://redis:6379/0
    volumes:
      - ./data:/data
      - .:/app
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data:
