services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      OJ_DB_URL: sqlite:////data/oj.db
      OJ_DATA_DIR: /data
      OJ_REDIS_URL: redis://redis:6379/0
    volumes:
      - ./data:/data
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - redis

  worker:
    build: .
    command: ["python", "-m", "worker.run_worker"]
    privileged: true
    environment:
      OJ_DB_URL: sqlite:////data/oj.db
      OJ_DATA_DIR: /data
      OJ_REDIS_URL: redis://redis:6379/0
    volumes:
      - ./data:/data
      - .:/app
    depends_on:
      - redis
